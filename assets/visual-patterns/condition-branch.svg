<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">换设备后能否找回？</title><desc id="desc">只在原设备保存的记录不能由新设备直接取得；网站按账号保存时，新设备可请求取回。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">换设备后能否找回？</text><rect x="24" y="89" width="312" height="64" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="180" y="129" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">记录保存在哪里？</text><path d="M180 155 V180 H85 V220" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><path d="M180 180 H275 V220" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><rect x="24" y="220" width="130" height="80" rx="12" fill="white" stroke="#175CD3" stroke-width="2"/><rect x="206" y="220" width="130" height="80" rx="12" fill="#ECFDF3" stroke="#067647" stroke-width="2"/><text x="89" y="253" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">仅原设备</text><text x="89" y="281" font-size="18" fill="#42526E" text-anchor="middle" font-weight="400">本地保存</text><text x="271" y="253" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">网站</text><text x="271" y="281" font-size="18" fill="#067647" text-anchor="middle" font-weight="400">按账号保存</text><path d="M89 302 V346" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><path d="M271 302 V346" fill="none" stroke="#067647" stroke-width="2.5" marker-end="url(#green)"/><text x="89" y="375" font-size="18" fill="#172B4D" text-anchor="middle" font-weight="400">新设备没有</text><text x="271" y="375" font-size="18" fill="#067647" text-anchor="middle" font-weight="400">可请求取回</text><text x="24" y="437" font-size="18" fill="#172B4D" text-anchor="start" font-weight="400">比较条件：换设备，登录同一账号。</text><text x="24" y="468" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">假设没有其他备份或同步机制。</text>
</g></svg>
