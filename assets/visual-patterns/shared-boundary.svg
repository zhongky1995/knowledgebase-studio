<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">两台设备读同一份记录</title><desc id="desc">手机和电脑使用同一账号向网站请求收藏；网站保管一份账号收藏记录。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">两台设备读同一份记录</text><rect x="24" y="98" width="132" height="104" rx="9" fill="white" stroke="#42526E" stroke-width="2"/><text x="90" y="137" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">手机</text><text x="90" y="172" font-size="18" fill="#172B4D" text-anchor="middle" font-weight="400">账号：小林</text><rect x="204" y="98" width="132" height="104" rx="9" fill="white" stroke="#42526E" stroke-width="2"/><text x="270" y="137" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">电脑</text><text x="270" y="172" font-size="18" fill="#172B4D" text-anchor="middle" font-weight="400">账号：小林</text><path d="M90 204 V292" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><path d="M270 204 V292" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><text x="180" y="268" font-size="18" fill="#175CD3" text-anchor="middle" font-weight="400">请求收藏</text><rect x="24" y="292" width="312" height="138" rx="12" fill="#ECFDF3" stroke="#067647" stroke-width="2"/><text x="42" y="326" font-size="20" fill="#067647" text-anchor="start" font-weight="600">网站保存的记录</text><rect x="42" y="348" width="276" height="52" rx="6" fill="white" stroke="#067647" stroke-width="2"/><text x="54" y="381" font-size="18" fill="#172B4D" text-anchor="start" font-weight="400">小林  /  文章 A  /  已收藏</text><text x="24" y="471" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">边框表示存放位置；回复未画出。</text>
</g></svg>
