<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">请求和回复分别传递</title><desc id="desc">浏览器向网站请求订单；网站核对账号后，把订单回复给浏览器。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">请求和回复分别传递</text><rect x="24" y="88" width="118" height="58" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><rect x="218" y="88" width="118" height="58" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="83" y="124" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">浏览器</text><text x="277" y="124" font-size="20" fill="#172B4D" text-anchor="middle" font-weight="600">网站</text><path d="M83 146 V406 M277 146 V406" stroke="#B8C4D4" stroke-width="2"/><text x="180" y="187" font-size="18" fill="#175CD3" text-anchor="middle" font-weight="400">① 请求：查看订单</text><path d="M83 207 H277" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><rect x="202" y="230" width="134" height="54" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="269" y="264" font-size="18" fill="#172B4D" text-anchor="middle" font-weight="400">核对账号</text><text x="180" y="321" font-size="18" fill="#067647" text-anchor="middle" font-weight="400">② 回复：订单内容</text><path d="M277 340 H83" fill="none" stroke="#067647" stroke-width="2.5" marker-end="url(#green)"/><text x="24" y="445" font-size="18" fill="#172B4D" text-anchor="start" font-weight="400">网站核对账号后，再返回订单。</text><text x="24" y="475" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">箭头表示传递方向，不表示耗时。</text>
</g></svg>
