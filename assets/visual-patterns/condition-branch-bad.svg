<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">换设备后能否找回？</title><desc id="desc">反例：段落被装进同样的方框，缺少具体对象与关系。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">换设备后能否找回？</text><rect x="100" y="110" width="160" height="65" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="180" y="150" font-size="16" fill="#172B4D" text-anchor="middle" font-weight="400">数据持久化</text><path d="M180 177 V220 H80 V260" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><path d="M180 220 H280 V260" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><rect x="24" y="260" width="120" height="80" rx="12" fill="#FEE4E2" stroke="#B42318" stroke-width="2"/><rect x="216" y="260" width="120" height="80" rx="12" fill="#DCFAE6" stroke="#067647" stroke-width="2"/><text x="24" y="411" font-size="14" fill="#9CA3AF" text-anchor="start" font-weight="400">不同状态会影响系统最终的结果。</text>
</g></svg>
