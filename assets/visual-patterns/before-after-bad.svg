<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">收藏改变了什么？</title><desc id="desc">反例：段落被装进同样的方框，缺少具体对象与关系。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">收藏改变了什么？</text><rect x="24" y="94" width="312" height="78" rx="12" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="2"/><text x="36" y="122" font-size="16" fill="#9CA3AF" text-anchor="start" font-weight="400">状态生命周期与归属管理</text><text x="36" y="145" font-size="13" fill="#9CA3AF" text-anchor="start" font-weight="400">执行处理、协调状态并完成系统闭环。</text><path d="M180 174 V193" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><rect x="24" y="194" width="312" height="78" rx="12" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="2"/><text x="36" y="222" font-size="16" fill="#9CA3AF" text-anchor="start" font-weight="400">跨层级协作与信息表达</text><text x="36" y="245" font-size="13" fill="#9CA3AF" text-anchor="start" font-weight="400">执行处理、协调状态并完成系统闭环。</text><path d="M180 274 V293" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><rect x="24" y="294" width="312" height="78" rx="12" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="2"/><text x="36" y="322" font-size="16" fill="#9CA3AF" text-anchor="start" font-weight="400">持久化反馈及边界一致性</text><text x="36" y="345" font-size="13" fill="#9CA3AF" text-anchor="start" font-weight="400">执行处理、协调状态并完成系统闭环。</text>
</g></svg>
