<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
<title id="title">请求和回复分别传递</title><desc id="desc">反例：段落被装进同样的方框，缺少具体对象与关系。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175CD3"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#067647"/></marker></defs>
<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">请求和回复分别传递</text><rect x="24" y="110" width="115" height="100" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><rect x="221" y="110" width="115" height="100" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="82" y="160" font-size="16" fill="#172B4D" text-anchor="middle" font-weight="400">客户端</text><text x="278" y="160" font-size="16" fill="#172B4D" text-anchor="middle" font-weight="400">服务端</text><path d="M139 130 L221 190" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><path d="M221 130 L139 190" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><text x="24" y="292" font-size="14" fill="#9CA3AF" text-anchor="start" font-weight="400">跨层协作、传输处理、状态回传。</text><text x="24" y="318" font-size="14" fill="#9CA3AF" text-anchor="start" font-weight="400">请求响应过程实现信息表达与交付。</text>
</g></svg>
