<rect width="360" height="500" fill="white"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24" y="42" font-size="24" fill="#172B4D" text-anchor="start" font-weight="650">收藏改变了什么？</text><rect x="24" y="98" width="312" height="144" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="40" y="130" font-size="20" fill="#172B4D" text-anchor="start" font-weight="650">收藏前</text><text x="40" y="165" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">页面</text><path d="M287 145 l6 13 15 2 -11 10 3 15 -13 -7 -13 7 3 -15 -11 -10 15 -2Z" fill="white" stroke="#42526E" stroke-width="2"/><text x="40" y="210" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">记录</text><rect x="94" y="184" width="222" height="38" rx="6" fill="white" stroke="#B8C4D4" stroke-width="2"/><text x="108" y="210" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">还没有收藏</text><rect x="24" y="270" width="312" height="144" rx="12" fill="#F5F7FA" stroke="#B8C4D4" stroke-width="2"/><text x="40" y="302" font-size="20" fill="#172B4D" text-anchor="start" font-weight="650">收藏后</text><text x="40" y="337" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">页面</text><path d="M287 317 l6 13 15 2 -11 10 3 15 -13 -7 -13 7 3 -15 -11 -10 15 -2Z" fill="#FEF0C7" stroke="#92400E" stroke-width="2"/><text x="40" y="382" font-size="18" fill="#42526E" text-anchor="start" font-weight="400">记录</text><rect x="94" y="356" width="222" height="38" rx="6" fill="#ECFDF3" stroke="#067647" stroke-width="2"/><text x="108" y="382" font-size="18" fill="#067647" text-anchor="start" font-weight="400">新增：文章 A</text><path d="M180 244 V267" fill="none" stroke="#175CD3" stroke-width="2.5" marker-end="url(#blue)"/><text x="24" y="461" font-size="18" fill="#172B4D" text-anchor="start" font-weight="400">网站保存记录，页面显示已收藏。</text>
</g></svg>
